    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        html { scroll-behavior: smooth; }
        .tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: bold; }
    </style>

<body class="bg-slate-50 font-sans text-slate-800 pb-20">

    <header class="bg-gradient-to-r from-indigo-900 to-purple-800 text-white p-6 shadow-md">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-xl font-bold mb-1">CLEAR 鑑定フロー</h1>
                <p class="text-[10px] text-indigo-200 opacity-90 uppercase tracking-widest">運営公式マニュアル</p>
            </div>
            <button onclick="toggleHelp()" class="p-2 bg-white/10 rounded-full hover:bg-white/20 transition-colors">
                <i data-lucide="help-circle" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="px-4 py-6 max-w-md mx-auto">
        <div class="mb-8 bg-amber-50 rounded-2xl p-5 border border-amber-100 shadow-sm">
            <h2 class="text-xs font-black text-amber-700 mb-3 flex items-center gap-1">
                <i data-lucide="check-square" class="w-4 h-4"></i>
                これだけ意識！成功の鉄則
            </h2>
            <ul class="text-[12px] space-y-2 text-amber-900/80">
                <li class="flex items-start gap-2"><span>・</span><b>返信は即レス：</b>相談した瞬間が、悩みのピークです</li>
                <li class="flex items-start gap-2"><span>・</span><b>短文ラリー：</b>長文は圧迫感を与えます</li>
                <li class="flex items-start gap-2"><span>・</span><b>ヒアリング優先：</b>即鑑定より状況把握が信頼の鍵</li>
            </ul>
        </div>

        <div class="mb-8">
            <h2 class="text-[10px] font-black text-slate-400 mb-3 ml-1 uppercase tracking-widest flex justify-between">
                メニュー
                <span>スワイプ →</span>
            </h2>
            <div class="flex overflow-x-auto pb-4 gap-2 snap-x hide-scrollbar" id="flow-steps"></div>
        </div>

        <div class="space-y-10" id="flow-details"></div>
    </main>

    <script>

                    { type: "親身", text: "ご依頼ありがとうございます！✨\nお力になれるご縁をいただけて嬉しいです🥰\n\n心を込めて視させていただきますので、まずはリラックスしてお話聞かせてくださいね🌿🪄" },

            {

                advice: "質問をまとめて聞くことで、お客様の「何度も返す手間」を減らします。",
                variants: [
                    { type: "標準", text: "ご相談ありがとうございます！\nより深く視るために、まずはあなた様ご自身の性格や恋愛傾向について、3つ教えていただけますか？\n\n①周囲からはどのような性格だと言われる？\n②嬉しい/不安なことは、誰かにすぐ話す派？それとも溜め込みやすい？\n③恋愛では「安心感・安定」と「ときめき・刺激」どちらを重視する？" },
                    { type: "親身", text: "ご依頼ありがとうございます✨\nお力になれるよう、まずは3つだけ教えてね☺️💭\n\n①周りからはどんな性格って言われることが多い？🌷\n②不安な時は誰かにすぐ話すタイプかな？それとも一人で抱えちゃう？🧸\n③恋愛は「安心感」と「ドキドキ」どっちが好きかな？🪄" },
                    { type: "誠実", text: "ご相談ありがとうございます。\nお気持ちを大切に読み解くために、まずはあなた様の基本的な性格や価値観について教えてください。\n\n①客観的に見た、ご自身の性格傾向\n②お悩みを周囲に相談されるか、ご自身で向き合われるか\n③恋愛において、心の安らぎと高揚感のどちらを重んじるか" }
                ]
            },
            {
                id: 3,
                emoji: "🔮",
                iconColor: "bg-amber-50 text-amber-600",
                title: "初回鑑定（STEP1）",
                point: "性格・恋愛傾向を鑑定。最後に質問を投げ、お相手への期待感を高めます。",
                good: "現状を深掘りしつつ、「お相手の気持ち」への期待感を高める",
                bad: "お相手の気持ちまで一気に説明しつくしてしまう",
                advice: "有料鑑定箇所は句読点や絵文字を控え、空白を使いましょう（目安：150〜300文字）。お客様のタイプに合わせて内容を調整してください。",
                variants: [
                    { type: "標準", text: "【無料部分】\nお待たせいたしました。これより深く鑑定してまいります！\n\n【有料鑑定】\nあなた様は人の気持ちに敏感で　相手を思いやる優しさを自然と発揮できる方です　その場の空気を読んで行動できる反面　ご自身の本音を後回しにしてしまう傾向があります\n恋愛では相手を傷つけたくないという思いが強く　知らず知らずのうちに我慢が積み重なりやすい運勢が出ています　現状を打開するためには　☆☆を意識することを心掛けましょう\n\n【無料部分】\n次は、お相手様が今抱いている「本音」を深く読み解きますね！\n特に『復縁の可能性』と『連絡をくれる時期』どちらを重点的に視てほしいですか？😊" },
                    { type: "親身", text: "【無料部分】\nお待たせしました🙂‍↕️今から心を込めて鑑定しますので、少しの間リラックスして待っていてくださいね🌿\n\n【有料鑑定】\nあなた様を視てみると　とても感情が豊かで素敵な方です　ですがその素直さゆえに恋愛ではお相手に振り回されてしまい　今は□□ですごくお辛い状況にいるのだと感じました\n恋愛では気持ちが行動に表れやすいため　お相手にとっては分かりやすい反面　感情の波が大きくなりやすい暗示も見られます\nそんなあなた様が幸せを掴むためには　☆☆を大切にしてみてくださいね\n\n【無料部分】\n次は一番気になる「お相手様の今の本心」を覗いてみましょうか💭\n特に『私への未練』と『新しい恋人の有無』どっちが知りたいかな？😊" },
                    { type: "誠実", text: "【無料部分】\nありがとうございます。これより精神を集中させ、あなた様の運勢を読み解いてまいります。\n\n【有料鑑定】\nあなた様の本質には物事を客観的に捉えられる素晴らしい一面が宿っています　ただ恋愛においては本音を表に出すことが少なく　お相手様から「何を考えているか分からない」と誤解されやすい傾向もあるようです\nその結果として　現在の□□という苦しい状況を招いている可能性があります　現状を打開するためには　☆☆を心に留めておく必要があります\n\n【無料部分】\n続いて、お相手様の深層心理にアクセスし、その胸の内に迫ります。\n特に『今の本音』か『今後の展開』どちらを詳しく読み解きましょうか？" }
                ]
            },
            {
                id: 4,
                emoji: "💬",
                iconColor: "bg-teal-50 text-teal-500",
                title: "鑑定後ヒアリング",
                point: "STEP1の結果への共感を得つつ、2回目鑑定（お相手の本音）へ導きます。",
                good: "前ステップで投げかけた質問の回答を受け取り、期待値を最大化する",
                bad: "質問を無視して定型文を送る",
                advice: "「当てはまる点はありましたか？」と聞くことで会話が継続します。",
                variants: [
                    { type: "標準", text: "お返事ありがとうございます。〇〇（未練/時期など）についてですね、承知いたしました。\n\nそれではこれより、お相手様の深層心理に深くアクセスしてまいります。\n鑑定結果が出るまで、少々お待ちいただけますでしょうか。" },
                    { type: "親身", text: "教えてくれてありがとう！✨やっぱり〇〇が一番気になるよね🥲\n今からお相手様の心の奥底をしっかり覗いて、本音をすべて受け取ってくるね！🪄\n\n少しの間、リラックスして待っていてね🌿" },
                    { type: "誠実", text: "ご回答ありがとうございます。承知いたしました。\n\nそれでは、お相手様が今あなた様に何を求めているのか、その真実を重点的に精査してまいります。現状を打破する答えを持って戻りますので、お待ちください。" }
                ]
            },
            {
                id: 5,
                emoji: "🪄",
                iconColor: "bg-purple-50 text-purple-600",
                title: "2回目鑑定（STEP2〜3）",
                point: "相手の本心(STEP2)と、具体的なアドバイス(STEP3)を伝えます。",
                good: "現状→相手の気持ち→今後の展開の順で段階的に進める",
                bad: "悪い結果だけ伝え、解決策を出さない",
                advice: "有料箇所は句読点・絵文字を制限し、空白で構成してください。200〜300文字程度のボリュームを意識しましょう。",
                variants: [
                    { type: "標準", text: "【無料部分】\nお待たせいたしました。お相手様の今の本音を視ました！\n\n【有料鑑定】\n今は少し迷いがあるようですが　あなた様への情は残っています　お相手様が今一番恐れているのは　あなた様との関係がまた同じ結末を迎えることです\nそれを防ぐためには　今は無理に連絡をせず　〇〇のタイミングを待つことが最善です　来週あたりに一度　軽い内容で連絡を入れてみると流れが変わりますよ\n\n【無料部分】\n続けてもよろしいでしょうか？次はさらに具体的な「好転のタイミング」をお伝えしますね。" },
                    { type: "親身", text: "【無料部分】\nお待たせしました🙇お相手様の本当の気持ち、しっかり受け取ってきたよ！\n\n【有料鑑定】\nお相手様　今はちょっと考え込みたい時期のようです　でも決して嫌いになったわけではないので安心してくださいね　今は自分一人で状況を整理したいという思いが強く出ています\nあと〇日ほど待ってから連絡をしてみると　きっと良い反応が返ってきますよ　信じて待ってみましょう\n\n【無料部分】\nきっと明るい未来が待っています。準備ができたら教えてね😊" },
                    { type: "誠実", text: "【無料部分】\nお待たせいたしました。お相手様の深層を読み解いた結果をお伝えします。\n\n【有料鑑定】\nあなた様を大切な存在だと認識されていますが　〇〇という事情で一歩踏み出せずにいらっしゃるようです　その心の障壁を取り除くためには　あなた様が△△という姿勢を見せることが重要になります\n今取るべき最善の行動は☆☆です　一歩ずつ　確実に状況を好転させていきましょう\n\n【無料部分】\nこの結果を元に、次は「いつ具体的に動くべきか」を霊視いたします。継続されますか？" }
                ]
            },
            {
                id: 6,
                emoji: "🌙",
                iconColor: "bg-orange-50 text-orange-500",
                title: "締めの言葉",
                point: "当日の振り返りと次回時期を提示し、次へのきっかけを作ります。",
                good: "感謝と共に、次回予約の目安（〇日後など）を伝える",
                bad: "感謝のみで終わる。次回予約に触れない",
                advice: "「変化が出やすい時期」を数字で伝えると、納得感と安心感が増します。",
                variants: [
                    { type: "標準", text: "本日はありがとうございました。\n恋愛の流れは時間経過で変化します。\n\n今回の流れだと〇〇頃に動きが出る予感です。その頃にまた状況を視させてくださいね。" },
                    { type: "親身", text: "今日はたくさんお話しできて良かったです🥰\n\n〇〇頃にまた流れが大きく変わるので、その頃にまたお話ししましょう✨\nもし途中で不安になったら、いつでも頼ってくださいね🌷" },
                    { type: "誠実", text: "本日は誠にありがとうございました。\n恋愛の流れは時間とともに変化します。\n\n状況が動き始めるのは〇〇後と予測されますので、その際に再び推移を確認し、次なる一手を見極めましょう。応援しております。" }
                ]
            },
            {
                id: 7,
                emoji: "🤝",
                iconColor: "bg-rose-50 text-rose-500",
                title: "アフターフォロー",
                point: "翌日〜3日以内に送信します。",
                good: "名前を呼び、さりげなく現状を伺う（鑑定打診はしない）",
                bad: "「鑑定しませんか？」と直接的な営業をかける",
                advice: "お客様が自分から話しやすいように、優しく背中を押してあげることが大事です。",
                variants: [
                    { type: "標準", text: "〇〇様、こんにちは。先日はありがとうございました。\nその後、お気持ちや状況に変化はありましたか？\n\n何か小さな変化でも、また一緒に視ていけたらと思っています。" },
                    { type: "親身", text: "〇〇様、こんにちは🌿\nあの後、何か状況に変化はあったかな？って気になっていました🥲\n\n小さなことでも、気になる出来事があればいつでも近況を聞かせてね🌷" },
                    { type: "誠実", text: "〇〇様、その後のご様子はいかがでしょうか。\n鑑定でお伝えしたことが、少しでも心の安らぎとなっていれば幸いです。\n\nもし新しい動きや不安が生じた際は、いつでもここを頼ってくださいね。" }
                ]
            }
        ];

        const steps = ['アポメ', 'ヒアリング', '初回鑑定', '鑑定後ヒアリング', '2回目鑑定', '締め', 'アフター'];

        function renderApp() {
            const flowStepsContainer = document.getElementById('flow-steps');
            flowStepsContainer.innerHTML = '';
            steps.forEach((step, idx) => {
                const stepId = idx + 1;
                let html = `<div class="flex-shrink-0 flex items-center snap-center"><a href="#step-${stepId}" class="px-5 py-3 rounded-2xl text-[12px] whitespace-nowrap bg-indigo-600 text-white font-bold shadow-md active:scale-95 transition-transform">${step}</a>`;
                if (idx < steps.length - 1) html += `<i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 mx-1"></i>`;
                html += `</div>`;
                flowStepsContainer.insertAdjacentHTML('beforeend', html);
            });

            const flowDetailsContainer = document.getElementById('flow-details');
            flowDetailsContainer.innerHTML = '';
            flowData.forEach(step => {
                const sectionHtml = `
                    <div id="step-${step.id}" class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden scroll-mt-6">
                        <div class="flex items-center gap-4 p-6 border-b border-slate-50 bg-slate-50/50">
                            <div class="w-14 h-14 flex items-center justify-center rounded-2xl shadow-sm border border-slate-100 text-3xl ${step.iconColor}">
                                ${step.emoji}
                            </div>
                            <h2 class="text-xl font-bold text-slate-800">${step.title}</h2>
                        </div>
                        <div class="p-6 space-y-6">
                            <div class="bg-indigo-50/40 rounded-2xl p-5 border border-indigo-100/30">
                                <p class="text-[14px] text-slate-600 leading-relaxed font-medium"><span class="text-indigo-500 mr-1 font-bold">●</span>${step.point}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-4 font-bold">
                                <div class="bg-emerald-50/50 p-4 rounded-2xl border border-emerald-100/50 text-center">
                                    <div class="text-[10px] text-emerald-600 mb-1 tracking-tighter uppercase">良い例</div>
                                    <p class="text-[11px] text-slate-700 leading-tight">${step.good}</p>
                                </div>
                                <div class="bg-rose-50/50 p-4 rounded-2xl border border-rose-100/50 text-center">
                                    <div class="text-[10px] text-rose-600 mb-1 tracking-tighter uppercase">悪い例</div>
                                    <p class="text-[11px] text-slate-700 leading-tight">${step.bad}</p>
                                </div>
                            </div>
                            <div class="pt-2">
                                <div class="flex border-b border-slate-100 mb-5">
                                    ${step.variants.map((v, i) => `
                                        <button onclick="switchTab(this, ${step.id}, ${i})" class="flex-1 py-3 text-sm transition-all ${i === 0 ? 'tab-active' : 'text-slate-400'}">
                                            ${v.type}
                                        </button>
                                    `).join('')}
                                </div>
                                <div id="variant-content-${step.id}">${renderVariant(step.id, step.variants[0])}</div>
                            </div>
                            <div class="mt-4 p-5 bg-amber-50/50 rounded-2xl border border-amber-100/50">
                                <div class="flex items-center gap-2 mb-2 text-amber-600">
                                    <i data-lucide="lightbulb" class="w-4 h-4"></i>
                                    <span class="text-[10px] font-black uppercase tracking-widest">アドバイス</span>
                                </div>
                                <p class="text-[13px] text-slate-600 leading-relaxed">${step.advice}</p>
                            </div>
                        </div>
                    </div>
                `;
                flowDetailsContainer.insertAdjacentHTML('beforeend', sectionHtml);
            });
            lucide.createIcons();
        }

        function renderVariant(stepId, variant) {
            return `
                <div class="relative border border-slate-100 rounded-3xl bg-slate-50/30 overflow-hidden transition-all">
                    <div class="p-5 text-[14px] text-slate-700 leading-relaxed whitespace-pre-wrap">${variant.text}</div>
                    <button onclick="copyText(this, \`${variant.text.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\n/g, '\\n')}\`)" class="w-full flex items-center justify-center gap-3 py-4 bg-white border-t border-slate-100 text-indigo-600 font-bold text-sm active:bg-indigo-50">
                        <i data-lucide="copy" class="w-5 h-5"></i>
                        <span>例文をコピーする</span>
                    </button>
                </div>
            `;
        }

        function switchTab(btn, stepId, variantIdx) {
            const tabs = btn.parentElement.querySelectorAll('button');
            tabs.forEach((t, i) => i === variantIdx ? t.classList.add('tab-active') : t.classList.remove('tab-active', 'text-slate-400'));
            tabs.forEach((t, i) => i !== variantIdx && t.classList.add('text-slate-400'));
            const step = flowData.find(s => s.id === stepId);
            document.getElementById(`variant-content-${stepId}`).innerHTML = renderVariant(stepId, step.variants[variantIdx]);
            lucide.createIcons();
        }

        function copyText(btnElement, text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            const originalContent = btnElement.innerHTML;
            btnElement.innerHTML = `<i data-lucide="check" class="w-5 h-5"></i><span>コピー完了！</span>`;
            btnElement.classList.add('bg-indigo-600', 'text-white');
            lucide.createIcons();
            setTimeout(() => {
                btnElement.innerHTML = originalContent;
                btnElement.classList.remove('bg-indigo-600', 'text-white');
                lucide.createIcons();
            }, 2000);
        }

        function toggleHelp() {
            document.getElementById('help-modal').classList.toggle('hidden');
        }

        document.addEventListener('DOMContentLoaded', renderApp);
    </script>

    <div id="help-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-6">
        <div class="bg-white rounded-[2rem] w-full max-w-sm overflow-hidden shadow-2xl p-8">
            <div class="flex justify-between items-center mb-6 text-slate-800">
                <h3 class="text-xl font-bold">使い方ガイド</h3>
                <button onclick="toggleHelp()"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="space-y-6 text-[14px] text-slate-600 leading-relaxed">
                <div class="flex gap-4">
                    <div class="bg-indigo-100 text-indigo-600 p-2 rounded-xl h-fit"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
                    <p><b>指針の確認：</b>鑑定の質を高め、リピートに繋げるポイントをまとめています。</p>
                </div>
                <div class="flex gap-4">
                    <div class="bg-indigo-100 text-indigo-600 p-2 rounded-xl h-fit"><i data-lucide="users" class="w-5 h-5"></i></div>
                    <p><b>キャラ別例文：</b>タブを切り替えて、状況に合った例文を選べます。</p>
                </div>
                <div class="flex gap-4">
                    <div class="bg-indigo-100 text-indigo-600 p-2 rounded-xl h-fit"><i data-lucide="copy" class="w-5 h-5"></i></div>
                   <p><b>ワンタップコピー：</b>ボタンを押してチャットに貼り付けるだけ！</p>
                </div>
            </div>
            <button onclick="toggleHelp()" class="w-full mt-10 py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-200 active:scale-95 transition-transform">了解しました</button>
        </div>
    </div>
</body>
</html>
